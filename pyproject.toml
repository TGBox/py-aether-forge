[project]
name = "py_aether_forge"
version = "0.1.0"
description = "A py-game tower defence game in hommage to the old warcraft 3 td maps - with a new twist."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pyside6>=6.7.0",
    "pygame-ce>=2.5.0",
]

[project.scripts]
py_aether_forge = "py_aether_forge:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]